services:
    _defaults:
        # Public for the direct access from the service container, deprecated since 3.3: private in 4.0
        public: true
        tags:
            - { name: container.private, package: cleverage/soap-process-bundle, version: '3.3' }

    CleverAge\SoapProcessBundle\Transformer\RequestTransformer:
        arguments:
            - '@cleverage_soap_process.registry.client'
        tags:
            # The code is the one returned by RequestTransformer::getCode(): the transformer is loaded lazily
            - { name: cleverage.transformer, code: soap_request }
    cleverage_soap_process.transformer.request:
        alias: CleverAge\SoapProcessBundle\Transformer\RequestTransformer
        public: false
        deprecated:
            package: cleverage/soap-process-bundle
            version: '3.3'
            message: 'The "%alias_id%" service alias is deprecated, use the "soap_request" transformer code or the class name of the transformer instead. It will be removed in 4.0.'
